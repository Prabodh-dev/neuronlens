[project]
name = "neuronlens"
version = "0.1.0"
description = "TopK sparse autoencoder interpretability toolkit for GPT-2 small"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
    "datasets",
    "numpy",
    "pyyaml",
    "tensorboard",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["neuronlens"]